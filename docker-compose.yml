version: "3.9"

services:
  backend:
    build: ./Back
    container_name: cvboost-back
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=mysql+pymysql://root:abc123.@mysql:3306/cvboostdatabase1
      - MONGO_URL=mongodb://mongo:27017
    depends_on:
      - mysql
      - mongo

  mysql:
    image: mysql:8.0
    container_name: cvboost-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: abc123.
      MYSQL_DATABASE: cvboostdatabase1
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mongo:
    image: mongo:7
    container_name: cvboost-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data: