services:
  db:
    image: mysql:8.0
    restart: always
    command: --lower-case-table-names=1
    environment:
      MYSQL_ROOT_PASSWORD: abc123.
      MYSQL_DATABASE: cv_generator
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pabc123."]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: